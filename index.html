<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ── VWH registry descriptor — read by `vwh inspect` ───────────── -->
  <meta name="vwh-registry"      content="v2">
  <meta name="vwh-registry-repo" content="notvcto/vwh-registry">
  <meta name="vwh-registry-url"  content="https://notvc.to/vwh-registry">
  <!-- ──────────────────────────────────────────────────────────────── -->

  <title>VWH Registry — notvcto</title>
  <style>
    :root {
      --bg:      #0c0d10;
      --fg:      #ededf0;
      --muted:   #74767f;
      --hair:    #1f2128;
      --accent:  #8ab4d8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { width: 100%; max-width: 30rem; text-align: center; }

    .eyebrow {
      font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.25rem;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 560;
      letter-spacing: -.01em;
      margin: 0 0 1.75rem;
    }
    .repo {
      display: inline-block;
      font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--fg);
      text-decoration: none;
      padding: .5rem .8rem;
      border: 1px solid var(--hair);
      border-radius: 7px;
      transition: border-color .15s ease;
    }
    .repo:hover { border-color: var(--accent); }
    .repo .at { color: var(--muted); }

    .rule {
      width: 2.5rem;
      height: 1px;
      background: var(--hair);
      margin: 2.5rem auto;
      border: 0;
    }

    .data { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.25rem; }
    .data a {
      font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s ease;
    }
    .data a:hover { color: var(--accent); }

    .verify {
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
      margin-bottom: 3rem;
    }
    .verify b { color: var(--fg); font-weight: 500; }

    footer {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--muted);
      max-width: 24rem;
      margin: 0 auto;
    }
    footer a { color: var(--muted); text-underline-offset: 2px; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">vwh &middot; registry</div>

    <h1>Cryptographic presence,<br>publicly anchored.</h1>

    <a class="repo" href="https://github.com/notvcto/vwh-registry">
      notvcto<span class="at">/</span>vwh-registry
    </a>

    <hr class="rule">

    <nav class="data">
      <a href="v2/keys.json">keys.json</a>
      <a href="v2/ledger.json">ledger.json</a>
    </nav>

    <div class="verify"><b>vwh inspect</b> &lt;artifact&gt;</div>

    <footer>
      A <a href="https://github.com/notvcto/vwh">VWH</a> key &amp; artifact registry.
      Signatures are verified locally and prove key possession, not identity.
      Registry data is advisory.
    </footer>
  </main>
</body>
</html>
